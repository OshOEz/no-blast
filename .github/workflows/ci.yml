name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version
      - name: Build (release)
        run: swift build -c release --product NoBlast
      - name: Tests and coverage floors
        run: scripts/coverage-gate.sh
      - name: Script tests
        run: for t in scripts/tests/*.sh; do bash "$t"; done
      - name: Shellcheck
        run: |
          command -v shellcheck || brew install shellcheck
          shellcheck scripts/*.sh scripts/tests/*.sh
          bash -n scripts/release.sh

  package:
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build and verify the app
        run: scripts/build-app.sh 0.0.0
      - name: Render the UI
        run: dist/NoBlast.app/Contents/MacOS/NoBlast --render-ui dist/ui
      - uses: actions/upload-artifact@v4
        with:
          name: NoBlast-dmg
          path: dist/NoBlast-0.0.0.dmg
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: dist/ui
          retention-days: 7
          if-no-files-found: error
